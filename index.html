<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12302B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Board">
<title>Meal Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --ink:#12302B; --ink-2:#3E5A52; --muted:#7C918A;
  --paper:#E9EEEB; --card:#FBFDFB; --line:#D2DDD8; --line-soft:#E3EAE7;
  --amber:#B5730F; --amber-soft:#F6EAD3;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --display:'Fraunces',Georgia,serif; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:left}
input,select{font:inherit;color:inherit}

.shell{max-width:1180px;margin:0 auto;padding:0 20px 120px}
.masthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:30px 0 18px;border-bottom:1px solid var(--line)}
.masthead h1{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.015em;margin:0}
.masthead .tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.masthead .spacer{flex:1}
.backup{padding:17px;margin-top:16px;display:grid;gap:13px}
.backup h3{font-family:var(--display);font-size:17px;font-weight:600;margin:0}
.backup textarea{width:100%;height:88px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  background:var(--paper);font-family:var(--mono);font-size:11px;line-height:1.45;resize:vertical}
.backup .sub{font-size:13px;color:var(--muted);margin:3px 0 0}
.saved-note{font-family:var(--mono);font-size:11px;color:var(--muted)}

.tabs{display:flex;gap:2px;margin:18px 0 24px;border-bottom:1px solid var(--line)}
.tab{padding:9px 15px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.tab-list{display:none}
.layout{display:grid;grid-template-columns:1fr 340px;gap:34px;align-items:start}

.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.btn{border:1px solid var(--line);border-radius:7px;padding:8px 14px;background:var(--card);font-size:14px;font-weight:500;text-align:center;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-2)}
.btn-solid{background:var(--ink);color:#F4F8F6;border-color:var(--ink)}
.btn-solid:hover{background:#0B211D}
.btn-sm{padding:5px 11px;font-size:13px}
.btn-quiet{border-color:transparent;color:var(--muted)}
.btn-quiet:hover{color:var(--ink);border-color:var(--line)}
.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.field:focus{outline:2px solid var(--ink-2);outline-offset:-1px;border-color:transparent}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.row{display:flex;gap:9px;align-items:center}
.count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.empty{padding:34px 22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;font-size:15px}

/* ---------- week ---------- */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.weekbar h2{font-family:var(--display);font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.day.today{border-color:var(--ink-2);box-shadow:inset 3px 0 0 var(--ink)}
.day-head{display:flex;align-items:baseline;gap:9px;padding:11px 16px 7px}
.day-name{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.day.today .day-name{color:var(--ink)}
.day-date{font-family:var(--mono);font-size:11px;color:var(--muted)}

.slot{display:flex;align-items:flex-start;gap:12px;padding:7px 16px;border-top:1px solid var(--line-soft)}
.slot.vacant{padding-top:2px;padding-bottom:2px}
.slot.vacant .slot-label{opacity:.6;padding-top:5px}
.slot.cooked .slot-body{opacity:.5}
.slot-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);width:90px;flex:none;padding-top:7px}
.slot-body{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:3px 0}
.slot-add{font-size:13px;color:var(--muted);padding:3px 8px;border-radius:6px;border:1px dashed var(--line)}
.slot-add:hover{color:var(--ink);border-color:var(--ink-2);border-style:solid}
.cook-btn{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 10px;flex:none;margin-top:5px}
.cook-btn:hover{border-color:var(--ink-2);color:var(--ink)}
.cook-btn.on{background:var(--ink);border-color:var(--ink);color:#F4F8F6}

.dish-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 5px 4px 11px;border-radius:20px;font-size:13.5px;background:var(--paper);border:1px solid var(--line-soft)}
.dish-chip.short{background:var(--amber-soft);border-color:#E8D4AE;color:#6E4708}
.chip-x{font-size:15px;line-height:1;padding:0 5px;color:var(--muted);border-radius:50%}
.chip-x:hover{color:var(--ink)}
.chip{display:inline-flex;gap:5px;align-items:baseline;padding:3px 9px;border-radius:20px;font-size:12.5px;background:var(--paper);border:1px solid var(--line-soft)}
.chip.short{background:var(--amber-soft);border-color:#E8D4AE;color:#6E4708}
.chip .amt{font-family:var(--mono);font-size:11px;opacity:.75}

/* ---------- picker ---------- */
.picker{padding:12px 16px 15px;background:var(--paper);border-top:1px solid var(--line-soft)}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin-top:9px;max-height:290px;overflow-y:auto}
.pick{padding:8px 11px;background:var(--card);border:1px solid var(--line);border-radius:8px;transition:border-color .15s}
.pick:hover{border-color:var(--ink-2)}
.pick.on{border-color:var(--ink);background:var(--paper)}
.pick .pn{font-size:14px;font-weight:500}
.pick .pm{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.pick .pm .need{color:var(--amber)}

/* ---------- grocery rail ---------- */
.rail{position:sticky;top:22px}
.rail-head{padding:15px 17px 12px;border-bottom:1px solid var(--line-soft)}
.rail-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rail-title h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0}
.ranges{display:flex;gap:4px;margin-top:11px}
.rg{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    border:1px solid var(--line);border-radius:20px;padding:3px 9px;flex:1;text-align:center}
.rg:hover{border-color:var(--ink-2);color:var(--ink)}
.rg.on{background:var(--ink);border-color:var(--ink);color:#F4F8F6}
.span-note{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:9px}
.rail-body{padding:6px 17px 15px;max-height:60vh;overflow-y:auto}
.aisle{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);padding:15px 0 7px;border-bottom:1px solid var(--line-soft);margin-bottom:5px}
.gitem{display:flex;gap:10px;align-items:flex-start;padding:6px 0;width:100%;animation:drop .22s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.gbox{width:16px;height:16px;flex:none;margin-top:3px;border:1.5px solid var(--line);border-radius:4px;background:var(--card)}
.gitem.done .gbox{background:var(--ink-2);border-color:var(--ink-2)}
.gitem.done .gbox::after{content:"";display:block;width:4px;height:8px;margin:0 auto;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(42deg)}
.gtext{flex:1;min-width:0}
.gname{font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gname .qty{font-family:var(--mono);font-size:12.5px;color:var(--amber);flex:none;font-weight:500}
.gitem.done .gname{color:var(--muted);text-decoration:line-through}
.gitem.done .qty{color:var(--muted)}
.gmath{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gwhy{font-size:11.5px;color:var(--muted)}
.rail-foot{padding:13px 17px;border-top:1px solid var(--line-soft);display:grid;gap:8px}

/* ---------- dishes ---------- */
.dish{display:flex;gap:13px;align-items:flex-start;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px}
.dish-body{flex:1;min-width:0}
.dish-name{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.01em}
.chip .prep{font-style:italic;opacity:.7}
.dish-ings{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
.role{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px}

/* ---------- pantry ---------- */
.pantry-group{margin-bottom:26px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.pitem.zero{border-color:#E8D4AE;background:#FEFCF7}
.pitem-name{flex:1;min-width:120px}
.qty-in{width:78px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-family:var(--mono);font-size:13px;text-align:right}
.unit-sel{width:96px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-family:var(--mono);font-size:12px}
.unit-tag{font-family:var(--mono);font-size:11px;color:var(--muted);width:52px;flex:none}

/* ---------- editor ---------- */
.editor{padding:19px;display:grid;gap:15px;margin-bottom:18px}
.editor label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.ing-line{display:flex;align-items:center;gap:9px;padding:6px 11px;background:var(--paper);border-radius:7px;margin-bottom:5px}
.ing-line .name{flex:0 1 auto;min-width:0;font-weight:500}
.prep-in{flex:1 1 110px;min-width:88px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:13px}
.prep-in::placeholder{color:var(--muted);font-style:italic}
.addgrid{display:grid;grid-template-columns:82px 104px 1fr 132px;gap:8px;margin-top:9px}
.addgrid.with-prep{grid-template-columns:76px 94px 1fr 1fr 118px}
.grid2{display:grid;grid-template-columns:1fr 160px;gap:9px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .rail{position:static}
  .rail-body{max-height:none}
  .tab-list{display:block}
  .hide-mobile{display:none}
  .grid2,.addgrid,.addgrid.with-prep{grid-template-columns:1fr}
  .shell{padding:0 16px 60px}
  .masthead h1{font-size:25px}
  .slot{flex-wrap:wrap;padding:9px 14px}
  .slot-label{width:auto;padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <h1>Meal Board</h1>
    <span class="tag">what we're eating &middot; what we need</span>
    <span class="spacer"></span>
    <button class="btn btn-sm btn-quiet" id="backup-toggle">Back up</button>
  </header>
  <div id="backup"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="view"></div>
</div>

<script>
/* ============================================================
   STORAGE — the only two functions that touch persistence.
   This copy uses localStorage, so data lives in the browser
   you're using. Different device = different data. Use the
   Back up button to move a copy between them.
   ============================================================ */
const KEY='mealboard:v1';
async function load(){
  try{ const raw=localStorage.getItem(KEY); return raw?JSON.parse(raw):null; }
  catch(e){ return null; }
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }
    catch(e){ console.error('Could not save',e); }
  },250);
}

/* ============================================================
   MODEL
     ingredient  {id, name, cat, unit, qty}
        The unit lives on the ingredient, never on the dish line,
        so a dish asking for 2 tbsp and a pantry holding 32 tbsp
        subtract cleanly with no conversion table anywhere.
     dish        {id, name, role, ing:[{id, amt, prep}]}
        prep is how this dish wants it — minced, cooked, softened.
        It belongs to the line, not the ingredient: garlic is
        minced in one dish and left whole in another.
     plan        '2026-08-18': { Dinner:[dishId,...] }
     cooked      ['2026-08-18|Dinner'] -> eaten, already deducted
   ============================================================ */
const AISLES=['Produce','Meat & fish','Dairy & eggs','Pantry','Frozen','Other'];
const MEALS=['Breakfast','Snack 1','Lunch','Snack 2','Dinner','Sweet Snack'];
const ROLES=['Breakfast','Main','Side','Snack','Soup & salad','Sweet','Other'];
/* Real measures, plus the units that belong to the item itself.
   No cans, jars or boxes — those aren't a quantity of anything. */
const UNITS=['','g','kg','oz','lb','tsp','tbsp','cup','fl oz','ml','L','clove','head','slice','bunch','stalk','sprig'];
const SUGGEST={
  'Breakfast':['Breakfast','Sweet'],
  'Snack 1':['Snack','Sweet'],
  'Lunch':['Soup & salad','Main','Side'],
  'Snack 2':['Snack','Sweet'],
  'Dinner':['Main','Side','Sweet'],
  'Sweet Snack':['Sweet','Snack']
};
const RANGES=[[7,'Week'],[14,'2 wks'],[30,'Month'],['all','All']];

let state={ingredients:[],dishes:[],plan:{},cooked:[],extras:[],bought:[]};
let tab='week', weekStart=startOfWeek(new Date()), editing=null, draft=null,
    picking=null, pickFilter='', range=7, showBackup=false;

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ing=id=>state.ingredients.find(i=>i.id===id);
const dish=id=>state.dishes.find(d=>d.id===id);
const num=n=>String(Math.round((n+Number.EPSILON)*100)/100);
const fmt=(a,u)=>u?`${num(a)} ${u}`:`${num(a)}\u00d7`;

function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; }
function dkey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weekDays(){ return [...Array(7)].map((_,i)=>addDays(weekStart,i)); }
function slot(k,m){ return (state.plan[k]&&state.plan[k][m])||[]; }
function setSlot(k,m,arr){
  if(!state.plan[k]) state.plan[k]={};
  state.plan[k][m]=arr;
  if(!arr.length) delete state.plan[k][m];
  if(!Object.keys(state.plan[k]).length) delete state.plan[k];
}
function span(days){
  const a=days[0], b=days[days.length-1];
  return a.getMonth()===b.getMonth()
    ? `${a.toLocaleDateString(undefined,{month:'long'})} ${a.getDate()}\u2013${b.getDate()}`
    : `${a.toLocaleDateString(undefined,{month:'short',day:'numeric'})} \u2013 ${b.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;
}

/* Days the grocery list forecasts over. Starts at the week you're
   looking at and runs forward. "All" reaches the last planned day. */
function rangeDays(){
  if(range!=='all') return [...Array(range)].map((_,i)=>addDays(weekStart,i));
  const keys=Object.keys(state.plan).sort();
  if(!keys.length) return weekDays();
  const last=new Date(keys[keys.length-1]+'T00:00:00');
  if(last<weekStart) return weekDays();
  const out=[]; for(let d=new Date(weekStart); d<=last; d=addDays(d,1)) out.push(new Date(d));
  return out;
}

function findOrCreateIngredient(name,cat,unit){
  const n=name.trim(); if(!n) return null;
  const hit=state.ingredients.find(i=>i.name.toLowerCase()===n.toLowerCase());
  if(hit) return hit;
  const made={id:uid(),name:n,cat:cat||'Other',unit:unit||'',qty:0};
  state.ingredients.push(made);
  return made;
}

/* Everything the forecast window needs, per ingredient. A dish
   planned three times counts three times. */
function needTotals(){
  const t=new Map();
  rangeDays().forEach(day=>{
    const k=dkey(day);
    MEALS.forEach(m=>{
      if(state.cooked.includes(k+'|'+m)) return;   // eaten, already deducted
      slot(k,m).forEach(did=>{
        const d=dish(did); if(!d) return;
        d.ing.forEach(l=>{
          const i=ing(l.id); if(!i) return;
          if(!t.has(l.id)) t.set(l.id,{item:i,amt:0,dishes:[]});
          const e=t.get(l.id);
          e.amt+=(+l.amt||0);
          e.dishes.push(d.name);
        });
      });
    });
  });
  return t;
}
function shortfall(){
  const out=new Map();
  needTotals().forEach((e,id)=>{
    const short=e.amt-(+e.item.qty||0);
    if(short>0.0001) out.set(id,{...e,short});
  });
  return out;
}
function plannedCount(){
  return weekDays().reduce((n,d)=>n+MEALS.reduce((s,m)=>s+slot(dkey(d),m).length,0),0);
}
function missingCount(d){
  return d.ing.filter(l=>{ const i=ing(l.id); return i && (+i.qty||0)<(+l.amt||0); }).length;
}
function cookSlot(k,m,undo){
  slot(k,m).forEach(did=>{
    const d=dish(did); if(!d) return;
    d.ing.forEach(l=>{
      const i=ing(l.id); if(!i) return;
      i.qty=Math.max(0,(+i.qty||0)+(+l.amt||0)*(undo?1:-1));
    });
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  renderTabs();
  renderBackup();
  const v=document.getElementById('view');
  if(tab==='list'){ v.innerHTML=`<div class="card">${railInner()}</div>`; return; }
  const main=tab==='week'?weekView():tab==='dishes'?dishesView():pantryView();
  v.innerHTML=`<div class="layout"><div>${main}</div>
    <aside class="hide-mobile"><div class="card rail">${railInner()}</div></aside></div>`;
  syncAddRow();
}
function renderTabs(){
  const n=shortfall().size+state.extras.length;
  const defs=[['week','Week',plannedCount()],['dishes','Dishes',state.dishes.length],
              ['pantry','Pantry',state.ingredients.length],['list','List',n]];
  document.getElementById('tabs').innerHTML=defs.map(([id,l,c])=>`
    <button class="tab${id==='list'?' tab-list':''}" role="tab" aria-selected="${tab===id}" data-tab="${id}">
      ${l}${c?`<span class="n">${c}</span>`:''}</button>`).join('');
}

/* ---------- Week ---------- */
function weekView(){
  if(!state.dishes.length) return firstRun();
  const today=dkey(new Date());
  const days=weekDays().map(day=>{
    const k=dkey(day);
    const slots=MEALS.map(m=>{
      const ids=slot(k,m), done=state.cooked.includes(k+'|'+m);
      const chips=ids.map(did=>{
        const d=dish(did); if(!d) return '';
        return `<span class="dish-chip${missingCount(d)?' short':''}">${esc(d.name)}
          <button class="chip-x" data-drop="${k}|${m}|${did}" aria-label="Remove ${esc(d.name)}">&times;</button></span>`;
      }).join('');
      const open=picking&&picking.key===k&&picking.meal===m;
      return `<div class="slot${done?' cooked':''}${ids.length?'':' vacant'}">
          <span class="slot-label">${m}</span>
          <div class="slot-body">${chips}
            <button class="slot-add" data-pick="${k}|${m}" aria-expanded="${open}">
              ${ids.length?'+ add':'+ add a dish'}</button></div>
          ${ids.length?`<button class="cook-btn${done?' on':''}" data-cook="${k}|${m}">
            ${done?'Cooked':'Mark cooked'}</button>`:''}
        </div>${open?picker(k,m):''}`;
    }).join('');
    return `<div class="day${k===today?' today':''}">
        <div class="day-head">
          <span class="day-name">${day.toLocaleDateString(undefined,{weekday:'long'})}</span>
          <span class="day-date">${day.getMonth()+1}/${day.getDate()}</span>
        </div>${slots}</div>`;
  }).join('');

  return `<div class="weekbar"><h2>${span(weekDays())}</h2>
      <div class="row">
        <button class="btn btn-sm" data-week="-1">&larr;</button>
        <button class="btn btn-sm" data-week="0">This week</button>
        <button class="btn btn-sm" data-week="1">&rarr;</button>
      </div></div>${days}`;
}

function picker(k,m){
  const q=pickFilter.toLowerCase(), chosen=slot(k,m);
  const list=state.dishes.filter(d=>!q||d.name.toLowerCase().includes(q))
    .map(d=>({d,sug:SUGGEST[m].includes(d.role)?0:1,miss:missingCount(d)}))
    .sort((a,b)=>a.sug-b.sug||a.miss-b.miss||a.d.name.localeCompare(b.d.name));
  return `<div class="picker">
      <div class="row">
        <input class="field" id="pick-q" placeholder="Search dishes" value="${esc(pickFilter)}" autocomplete="off">
        <button class="btn btn-sm btn-quiet" id="pick-close">Done</button>
      </div>
      <div class="picker-grid">${list.map(({d,miss})=>`
        <button class="pick${chosen.includes(d.id)?' on':''}" data-add="${k}|${m}|${d.id}">
          <div class="pn">${esc(d.name)}</div>
          <div class="pm">${esc(d.role)}${miss?` &middot; <span class="need">${miss} to buy</span>`:' &middot; all on hand'}</div>

}

/* The add row used to let you pick a unit that was then thrown
   away for an ingredient that already existed. Now it shows you
   the real unit the moment it recognises the name. */
function syncAddRow(){
  const el=document.getElementById('ing-name');
  if(!el) return;
  const u=document.getElementById('ing-unit'), c=document.getElementById('ing-cat'),
        note=document.getElementById('ing-known');
  const typed=el.value.trim();
  const hit=state.ingredients.find(i=>i.name.toLowerCase()===typed.toLowerCase());
  if(hit){
    u.value=hit.unit; c.value=hit.cat; u.disabled=true; c.disabled=true;
    note.innerHTML=`<strong>${esc(hit.name)}</strong> is already tracked in
      <strong>${esc(hit.unit||'whole units')}</strong> &mdash; ${fmt(+hit.qty||0,hit.unit)} on hand.
      Your amount will be read as ${esc(hit.unit||'a count')}. To change the unit, use the dropdown on
      its line once added.`;
  }else{
    u.disabled=false; c.disabled=false;
    note.textContent = typed ? 'New ingredient \u2014 the unit and aisle you pick here will stick.' : '';
  }
}

/* ---------- Backup ----------
   Your data lives in this artifact's storage. That survives a
   refresh, but it isn't yours to hold onto — so this hands you a
   plain JSON copy you can keep, and take to a real site later. */
function renderBackup(){
  const el=document.getElementById('backup');
  if(!showBackup){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="card backup">
    <div><h3>Keep a copy</h3>
      <p class="sub">${state.dishes.length} dishes, ${state.ingredients.length} pantry items,
        ${Object.keys(state.plan).length} planned days. Copy this somewhere safe.</p></div>
    <textarea id="bk-out" readonly onclick="this.select()">${esc(JSON.stringify(state))}</textarea>
    <div class="row">
      <button class="btn btn-sm btn-solid" id="bk-copy">Copy to clipboard</button>
      <button class="btn btn-sm" id="bk-file">Download as file</button>
      <span class="saved-note" id="bk-msg"></span>
    </div>
    <div><h3>Restore from a copy</h3>
      <p class="sub">Paste a backup here. This replaces everything currently in the app.</p></div>
    <textarea id="bk-in" placeholder="Paste your backup&hellip;"></textarea>
    <button class="btn btn-sm" id="bk-restore" style="justify-self:start">Restore</button>
  </div>`;
}
function bkMsg(t){ const m=document.getElementById('bk-msg'); if(m) m.textContent=t; }


function railInner(){
  const days=rangeDays();
  const rows=[];
  [...shortfall().values()].forEach(({item,amt,short,dishes})=>rows.push({
    id:item.id, name:item.name, cat:item.cat, qty:fmt(short,item.unit),
    math:`need ${fmt(amt,item.unit)} &middot; have ${fmt(+item.qty||0,item.unit)}`,
    why:[...new Set(dishes)].join(', ')
  }));
  state.extras.forEach(e=>rows.push({id:e.id,name:e.name,cat:e.cat,qty:'',math:'',why:'added by hand'}));
  const open=rows.filter(r=>!state.bought.includes(r.id)).length;

  const body=AISLES.map(a=>{
    const items=rows.filter(r=>r.cat===a);
    if(!items.length) return '';
    return `<div class="aisle">${a}</div>`+items.map(r=>{
      const done=state.bought.includes(r.id);
      return `<button class="gitem${done?' done':''}" data-buy="${r.id}"><span class="gbox"></span>
        <span class="gtext">
          <span class="gname"><span>${esc(r.name)}</span>${r.qty?`<span class="qty">${r.qty}</span>`:''}</span>
          ${r.math?`<span class="gmath">${r.math}</span><br>`:''}
          <span class="gwhy">${r.why}</span></span></button>`;
    }).join('');
  }).join('');

  return `<div class="rail-head">
      <div class="rail-title"><h2>Grocery list</h2>
        <span class="count">${open} item${open===1?'':'s'}</span></div>
      <div class="ranges">${RANGES.map(([v,l])=>
        `<button class="rg${range===v?' on':''}" data-range="${v}">${l}</button>`).join('')}</div>
      <div class="span-note">Covers ${span(days)} &middot; ${days.length} days</div>
    </div>
    <div class="rail-body">${body||`<div class="empty" style="border:none;padding:26px 4px">
      Plan a meal and anything you're short on lands here.</div>`}</div>
    <div class="rail-foot">
      <div class="row"><input class="field" id="x-name" placeholder="Add anything else" autocomplete="off">
        <button class="btn btn-sm" id="x-add">Add</button></div>
      ${state.bought.length?`<button class="btn btn-solid btn-sm" id="restock">
        Put ${state.bought.length} bought item${state.bought.length===1?'':'s'} away</button>`:''}
    </div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e=>{
  const t=e.target, hit=a=>t.closest(`[${a}]`);

  if(hit('data-tab')){ tab=hit('data-tab').dataset.tab; editing=null; picking=null; return render(); }
  if(hit('data-go')){ tab=hit('data-go').dataset.go; startNew(); return render(); }
  if(t.id==='backup-toggle'){ showBackup=!showBackup; return render(); }
  if(t.id==='seed'){ seed(); save(); return render(); }
  if(t.id==='bk-copy'){
    const ta=document.getElementById('bk-out');
    ta.select(); ta.setSelectionRange(0,999999);
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch(err){}
    if(ok) bkMsg('Copied.');
    else if(navigator.clipboard){
      navigator.clipboard.writeText(ta.value).then(()=>bkMsg('Copied.'),
        ()=>bkMsg('Copy blocked — select the text and copy manually.'));
    } else bkMsg('Select the text above and copy manually.');
    return;
  }
  if(t.id==='bk-file'){
    try{
      const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`meal-board-${dkey(new Date())}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      bkMsg('Downloaded.');
    }catch(err){ bkMsg('Download blocked here — use Copy instead.'); }
    return;
  }
  if(t.id==='bk-restore'){
    const raw=document.getElementById('bk-in').value.trim();
    if(!raw) return bkMsg('Nothing pasted.');
    let data;
    try{ data=JSON.parse(raw); }catch(err){ return bkMsg('That isn\u2019t valid backup text.'); }
    if(!Array.isArray(data.ingredients)||!Array.isArray(data.dishes))
      return bkMsg('That backup is missing its pantry or dishes.');
    if(!confirm(`Replace everything with this backup? ${data.dishes.length} dishes and ${data.ingredients.length} pantry items will overwrite what\u2019s here now.`)) return;
    state={ingredients:[],dishes:[],plan:{},cooked:[],extras:[],bought:[],...data};
    save(); showBackup=false; return render();
  }


  const rg=hit('data-range');
  if(rg){ const v=rg.dataset.range; range = v==='all'?'all':+v; return render(); }

  const w=hit('data-week');
  if(w){
    const v=+w.dataset.week;
    weekStart = v===0 ? startOfWeek(new Date())
      : (weekStart.setDate(weekStart.getDate()+7*v), startOfWeek(weekStart));
    picking=null; return render();
  }

  const pk=hit('data-pick');
  if(pk){
    const [k,m]=pk.dataset.pick.split('|');
    picking=(picking&&picking.key===k&&picking.meal===m)?null:{key:k,meal:m};
    pickFilter=''; render();
    const q=document.getElementById('pick-q'); if(q) q.focus();
    return;
  }
  if(t.id==='pick-close'){ picking=null; return render(); }
  const ad=hit('data-add');
  if(ad){
    const [k,m,did]=ad.dataset.add.split('|');
    if(state.cooked.includes(k+'|'+m)) return;
    const cur=slot(k,m);
    setSlot(k,m,cur.includes(did)?cur.filter(x=>x!==did):[...cur,did]);
    save(); render();
    const q=document.getElementById('pick-q'); if(q) q.focus();
    return;
  }
  const dr=hit('data-drop');
  if(dr){
    const [k,m,did]=dr.dataset.drop.split('|');
    if(state.cooked.includes(k+'|'+m)) return;
    setSlot(k,m,slot(k,m).filter(x=>x!==did));
    save(); return render();
  }
  const ck=hit('data-cook');
  if(ck){
    const key=ck.dataset.cook,[k,m]=key.split('|');
    const on=state.cooked.includes(key);
    cookSlot(k,m,on);
    state.cooked = on?state.cooked.filter(x=>x!==key):[...state.cooked,key];
    save(); return render();
  }

  // dishes
  if(t.id==='new-dish'){ startNew(); return render(); }
  const ed=hit('data-edit');
  if(ed){ editing=ed.dataset.edit; const d=dish(editing); draft={...d,ing:d.ing.map(l=>({...l}))}; return render(); }
  const dd=hit('data-del-dish');
  if(dd){
    const id=dd.dataset.delDish;
    state.dishes=state.dishes.filter(x=>x.id!==id);
    Object.keys(state.plan).forEach(k=>MEALS.forEach(m=>{
      if(slot(k,m).includes(id)) setSlot(k,m,slot(k,m).filter(x=>x!==id));
    }));
    save(); return render();
  }
  const ul=hit('data-unlink');
  if(ul){ draft.ing.splice(+ul.dataset.unlink,1); return render(); }
  if(t.id==='add-ing'){ return addIngredientToDraft(); }
  if(t.id==='cancel-dish'){ editing=null; draft=null; return render(); }
  if(t.id==='save-dish'){ return commitDish(); }

  // pantry
  const di=hit('data-del-ing');
  if(di){
    const id=di.dataset.delIng;
    state.ingredients=state.ingredients.filter(i=>i.id!==id);
    state.dishes.forEach(d=>{ d.ing=d.ing.filter(l=>l.id!==id); });
    save(); return render();
  }
  if(t.id==='p-add'){
    const n=document.getElementById('p-name');
    const made=findOrCreateIngredient(n.value,document.getElementById('p-cat').value,document.getElementById('p-unit').value);
    if(made){
      made.qty=+document.getElementById('p-amt').value||0;
      n.value=''; document.getElementById('p-amt').value='';
      save(); render();
    }
    return;
  }

  // grocery
  const b=hit('data-buy');
  if(b){
    const id=b.dataset.buy;
    state.bought=state.bought.includes(id)?state.bought.filter(x=>x!==id):[...state.bought,id];
    save(); return render();
  }
  if(t.id==='x-add'){
    const el=document.getElementById('x-name');
    if(el.value.trim()){ state.extras.push({id:uid(),name:el.value.trim(),cat:'Other'}); el.value=''; save(); render(); }
    return;
  }
  if(t.id==='restock'){
    const short=shortfall();
    state.bought.forEach(id=>{
      const i=ing(id); if(!i) return;
      const s=short.get(id);
      i.qty=(+i.qty||0)+(s&&s.short?s.short:0);
    });
    state.extras=state.extras.filter(x=>!state.bought.includes(x.id));
    state.bought=[];
    save(); return render();
  }
});

/* number and unit fields commit on blur/change so a re-render
   never eats what you're typing */
document.addEventListener('change', e=>{
  const q=e.target.closest('[data-qty]');
  if(q){ ing(q.dataset.qty).qty=Math.max(0,+q.value||0); save(); return render(); }
  const u=e.target.closest('[data-unit]');
  if(u){ ing(u.dataset.unit).unit=u.value; save(); return render(); }
  const lu=e.target.closest('[data-line-unit]');
  if(lu){ ing(lu.dataset.lineUnit).unit=lu.value; save(); return render(); }
  const a=e.target.closest('[data-amt]');
  if(a){ draft.ing[+a.dataset.amt].amt=Math.max(0,+a.value||0); return render(); }
  const p=e.target.closest('[data-prep]');
  if(p){ draft.ing[+p.dataset.prep].prep=p.value.trim(); return; }
});

document.addEventListener('input', e=>{
  if(e.target.id==='ing-name') return syncAddRow();
  if(e.target.id!=='pick-q') return;
  pickFilter=e.target.value;
  const at=e.target.selectionStart;
  render();
  const q=document.getElementById('pick-q');
  if(q){ q.focus(); q.setSelectionRange(at,at); }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'&&picking){ picking=null; return render(); }
  if(e.key!=='Enter') return;
  if(e.target.id==='ing-name'||e.target.id==='ing-amt'||e.target.id==='ing-prep'){ e.preventDefault(); addIngredientToDraft(); }
  if(e.target.id==='p-name'||e.target.id==='p-amt'){ e.preventDefault(); document.getElementById('p-add').click(); }
  if(e.target.id==='x-name'){ e.preventDefault(); document.getElementById('x-add').click(); }
});

function startNew(){ editing='new'; draft={id:uid(),name:'',role:'Main',ing:[]}; }
function addIngredientToDraft(){
  const el=document.getElementById('ing-name'), pr=document.getElementById('ing-prep');
  const made=findOrCreateIngredient(el.value,document.getElementById('ing-cat').value,document.getElementById('ing-unit').value);
  if(made && !draft.ing.some(l=>l.id===made.id))
    draft.ing.push({id:made.id, amt:+document.getElementById('ing-amt').value||1, prep:pr.value.trim()});
  el.value=''; pr.value=''; document.getElementById('ing-amt').value='';
  render(); document.getElementById('ing-amt').focus();
}
function commitDish(){
  draft.name=document.getElementById('d-name').value.trim();
  draft.role=document.getElementById('d-role').value;
  if(!draft.name){ document.getElementById('d-name').focus(); return; }
  const i=state.dishes.findIndex(d=>d.id===draft.id);
  if(i>=0) state.dishes[i]=draft; else state.dishes.push(draft);
  editing=null; draft=null; save(); render();
}

}

/* ---------- boot ---------- */
(async function(){
  const saved=await load();
  if(saved){
    state=Object.assign(state,saved);
    if(saved.meals && !saved.dishes){                    // original flat model
      state.dishes=saved.meals.map(m=>({...m,role:'Main'}));
      delete state.meals; state.plan={};
    }
    state.plan=state.plan||{}; state.cooked=state.cooked||[];
    state.ingredients.forEach(i=>{
      i.unit=i.unit||''; i.qty=+i.qty||0;
      if(i.staple!==undefined){                          // staples are gone
        if(i.staple && i.status==='stocked' && !i.qty) i.qty=0;
        delete i.staple; delete i.status;
      }
      if(['can','jar','box'].includes(i.unit)) i.unit='oz';  // no packaging units
    });
    state.dishes.forEach(d=>{
      d.ing=(d.ing||[]).map(l=>typeof l==='string'?{id:l,amt:1,prep:''}:{prep:'',...l});
      delete d.note;                                     // notes live on lines now
    });
  }
  render();
})();
</script>
